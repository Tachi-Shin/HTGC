<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ECMAScriptからFlutterへ</title>
  <style>
    main { padding: 24px; max-width: 560px; }
    button { padding: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>バイナリデータの集計</h1>
    <p id="status">待機中</p>
    <htgc-status></htgc-status>
    <p id="result"></p>
    <p id="date"></p>
    <button id="run" type="button">集計する</button>
  </main>
  <script>
    const state = new Proxy({status: '待機中'}, {
      set(target, key, value) {
        target[key] = value;
        document.getElementById(key).textContent = value;
        return true;
      }
    });
    const readyStatus = '準備完了';
    class StatusElement extends HTMLElement {
      connectedCallback() { this.textContent = readyStatus; }
    }
    customElements.define('htgc-status', StatusElement);
    class ResultBuffer extends SharedArrayBuffer {
      #view;
      constructor(length) {
        super(length);
        this.#view = new DataView(this);
      }
      read(index, littleEndian) {
        return this.#view.getUint16(index * 2, littleEndian);
      }
    }
    async function* records() {
      const buffer = new ResultBuffer(8);
      const signed = new Uint16Array(buffer);
      const littleEndian = new Uint8Array(new Uint16Array([1]).buffer)[0] === 1;
      for (let index = 0; index < 4; index++) {
        Atomics.store(signed, index, (index + 1) * 64);
        yield await Promise.resolve(buffer.read(index, littleEndian));
      }
    }
    document.getElementById('run').addEventListener('click', async () => {
      state.status = '集計中';
      const values = await Array.fromAsync(records());
      const data = new Uint16Array(values);
      const match = /total=(?<value>[\p{ASCII}&&\p{Decimal_Number}]+)/dv.exec('total=' + Math.sumPrecise(values));
      state.result = '合計 ' + match.groups.value + ' / ' + data.join(',');
      state.date = new Date(Date.UTC(2026, 10, 16)).toISOString();
      state.status = '完了';
    });
  </script>
</body>
</html>
