<!doctype html>
<html lang="ja">
<body>
  <p id="status">準備中</p>
  <script type="module">
    function calculate() {
      let value = 6;
      eval('value += 1');
      return Function('x', 'return x * 3')(value);
    }
    const AsyncGeneratorFunction = Object.getPrototypeOf(async function* () {}).constructor;
    const generator = AsyncGeneratorFunction('yield 4;')();
    const result = await generator.next();
    document.getElementById('status').textContent = String(calculate() + result.value);
  </script>
</body>
</html>
