<!doctype html>
<html lang="ja">
<body>
  <p id="status">準備中</p>
  <script type="module">
    function calculate() {
      let value = 6;
      eval('value += 1');
      return Function('x', 'return x * 3')(value);
    }
    document.getElementById('status').textContent = String(calculate());
  </script>
</body>
</html>
