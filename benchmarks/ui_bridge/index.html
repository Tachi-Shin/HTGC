<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>HTGC UI bridge</title>
  <style>
    @layer reset, theme, app;
    @import url("theme.css") layer(theme);
    @layer app.components {
      #layer-test {
        color: red;
        padding-left: 3px !important;
      }
    }
    @layer app {
      .layer-test {
        color: blue;
        padding-left: 4px !important;
        padding-right: 6px;
      }
    }
    @layer reset {
      .layer-test { color: green; padding-left: 2px !important; }
    }
    .layer-test { padding-right: 10px; padding-left: 1px !important; }
    article { padding: 12px; }
    #rule-wins, #inline-wins { color: blue !important; }
    #rule-wins { padding-left: 2px; padding: 5px; padding-left: 9px; }
  </style>
</head>
<body>
  <article>
    <p id="loop"></p>
    <textarea id="memo" oninput="editMemo(text, event.ui)">下書き</textarea>
    <button id="save" type="button" onclick="saveMemo(event.ui)">保存</button>
    <p id="status" hidden>待機中</p>
    <a href="next.html">次へ</a>
  </article>
  <p id="rule-wins" style="COLOR: red">スタイルシート</p>
  <p id="inline-wins" style="color: red !IMPORTANT; color: green">インライン</p>
  <p id="exception"></p>
  <p id="toggles" hidden></p>
  <p id="layer-test" class="layer-test" hidden></p>
  <p id="module-log" data-runs="" hidden></p>
  <template id="memo-template">
    <article id="template-content" hidden>テンプレートの本文</article>
    <template><span>入れ子</span></template>
    <script>throw 'template scripts are inert';</script>
  </template>
  <div id="template-result" hidden></div>
  <details id="first" name="options">
    <summary>最初の項目</summary>
    <p>最初の本文</p>
    <summary>別の見出し</summary>
  </details>
  <details id="second" name="options">
    <summary>次の項目</summary>
    <p>次の本文</p>
  </details>
  <details id="fallback">
    <p>既定の見出しの本文</p>
  </details>
  <dialog id="saved">
    <p id="message"></p>
    <button type="button" onclick="closeMemo(event.ui)">閉じる</button>
  </dialog>
  <script>
    let count = 0;
    do {
      count++;
    } while (count < 1);
    document.getElementById('loop').textContent = count + '回実行';
    let result = '';
    try {
      throw null;
    } catch (error) {
      var fromCatch = error === null;
      result = fromCatch ? '捕捉' : '失敗';
    } finally {
      result += '・終了';
    }
    try {
      throw 1;
    } catch {
      result += '・束縛なし';
    }
    switch ('2') {
      case 2:
        result += '・失敗';
        break;
      default:
        result += '・既定';
      case '3':
        result += '・次へ';
    }
    if (fromCatch) document.getElementById('exception').textContent = result;
    const toggles = document.getElementById('toggles');
    document.getElementById('first').addEventListener('toggle', event => {
      toggles.textContent += event.oldState + ':' + event.newState + ';';
    });
    const template = document.getElementById('memo-template');
    const host = document.getElementById('template-result');
    host.setAttribute('data-inert', document.getElementById('template-content') === null);
    host.setAttribute('data-nested', template.cloneNode(true).content.querySelector('template').content.textContent.trim());
    host.appendChild(template.content.cloneNode(true));
  </script>
  <script type="module" src="./module_state.js"></script>
  <script type="module">
    import increment, { count, readCycle } from './module_facade.js';
    import * as state from './module_state.js';
    const log = document.getElementById('module-log');
    log.textContent = count + ':' + increment() + ':' + state.count + ':' + readCycle();
  </script>
  <script type="module" src="./module_state.js"></script>
</body>
</html>
