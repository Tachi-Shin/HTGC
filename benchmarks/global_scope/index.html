<!doctype html>
<html lang="ja">
<body>
  <p id="status">待機中</p>
  <script>
    var shared = 2;
    let localLexical = 5;
    function readValue() { return shared + localLexical; }
  </script>
  <script>
    globalThis.shared = 4;
    globalThis.added = 3;
    let fromFunction = Function('return localLexical')();
    document.getElementById('status').textContent =
      String(readValue() + added + fromFunction) + ':' + String(globalThis === window && this === window);
  </script>
  <script type="module">
    let moduleOnly = 1;
    document.getElementById('status').textContent +=
      ':' + String(readValue()) + ':' + typeof globalThis.moduleOnly;
    const target = {};
    const token = {};
    const ref = new WeakRef(target);
    const registry = new FinalizationRegistry(held => held);
    registry.register(target, 'held', token);
    document.getElementById('status').textContent +=
      ':' + String(ref.deref() === target && registry.unregister(token));
    function checkIndirect() {
      let shared = 50;
      return (0, eval)('shared + localLexical');
    }
    document.getElementById('status').textContent += ':' + String(checkIndirect());
    let source = 'shared + localLexical';
    document.getElementById('status').textContent += ':' + String((0, eval)(source));
    function checkDynamic() { let local = 5; return eval('local' + ' + 2'); }
    document.getElementById('status').textContent += ':' + String(checkDynamic());
    let functionBody = 'if (shared > 0) { const result = shared + localLexical; return result }';
    document.getElementById('status').textContent += ':' + String(Function(functionBody)());
    source = 'let result = shared > 0 ? readValue() : 0; result';
    document.getElementById('status').textContent += ':' + String(eval(source));
  </script>
</body>
</html>
